<style>
:root{
  --bg:#0E1519; --panel:#FFFFFF; --ink:#0B1A24; --ink2:#4A5E6D; --ink3:#8698A5;
  --line:#D4DEE5; --line2:#E8EEF2;
  --frio:#0E4C6B; --frio2:#DCE9F0;
  --ok:#0F7A5A; --okbg:#E2F1EC;
  --amb:#B26A00; --ambbg:#FBEEDC;
  --rojo:#B3261E; --rojobg:#FBE6E4;
  --opo:#2D6FB5; --opobg:#E4EDF8;
  --etiq:#E9C46A;
  --r:3px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans",system-ui,sans-serif;font-size:15px;line-height:1.45;padding-bottom:60px}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:radial-gradient(1100px 520px at 18% -10%, rgba(46,93,124,.34), transparent 62%),
             radial-gradient(900px 460px at 92% 4%, rgba(233,196,106,.09), transparent 60%)}
.mono{font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums}
.num{font-family:"Barlow Condensed","IBM Plex Sans",sans-serif;font-variant-numeric:tabular-nums;font-weight:600}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
input{font:inherit}
:focus-visible{outline:2px solid var(--frio);outline-offset:2px}

.banner>*{position:relative;z-index:1}
.marca::before{content:"";position:absolute;left:-22px;right:-26px;top:-18px;bottom:-18px;z-index:-1;
  background:radial-gradient(ellipse at 30% 50%, rgba(12,15,17,.88) 0%, rgba(12,15,17,.55) 55%, transparent 78%)}
.fecha::before{content:"";position:absolute;left:-34px;right:-14px;top:-20px;bottom:-20px;z-index:-1;
  background:radial-gradient(ellipse at 55% 50%, rgba(12,15,17,.72) 0%, rgba(12,15,17,.34) 62%, transparent 84%)}
.marca,.fecha{position:relative}
.marca{display:flex;align-items:center;gap:15px;min-width:0}
.logo{width:118px;height:58px;flex:none}
.wm1{font-family:"IBM Plex Sans",sans-serif;font-size:16.5px;font-weight:400;letter-spacing:.30em;
  color:#F4F7F8;white-space:nowrap;line-height:1.1;text-shadow:0 1px 6px rgba(0,0,0,.55)}
.wm2{font-size:11.5px;letter-spacing:.05em;color:#AFBDC4;margin-top:3px;white-space:nowrap}
.bspacer{flex:1}
.fecha{text-align:right;line-height:1.15}
.fdia{font-family:"Barlow Condensed",sans-serif;font-size:25px;font-weight:600;letter-spacing:.03em;color:#fff;text-shadow:0 1px 6px rgba(0,0,0,.6)}
.fsem{font-size:11px;letter-spacing:.11em;text-transform:uppercase;color:#B4C2C9;margin-top:2px}
.fsem b{font-family:"Barlow Condensed",sans-serif;font-size:17px;font-weight:700;color:var(--etiq);letter-spacing:.04em;
  margin-left:4px;vertical-align:-1px}
.hbar{background:var(--frio);padding:7px 22px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.hmeta{font-size:12.5px;color:#B9D3E0;letter-spacing:.02em}
.hmeta b{color:#fff;font-weight:600}
.hbtn{border:1px solid rgba(255,255,255,.45);padding:6px 13px;border-radius:var(--r);font-size:13px;color:#EAF3F8;flex:none;background:rgba(10,14,16,.55);backdrop-filter:blur(2px)}
.hbtn:hover{background:rgba(255,255,255,.12);color:#fff;border-color:rgba(255,255,255,.5)}
nav{background:#0A3A52;box-shadow:0 2px 14px rgba(0,0,0,.4)}
.nbar{max-width:1680px;margin:0 auto;padding:0 22px;display:flex;gap:2px;overflow-x:auto}
.tab{font-family:"Barlow Condensed",sans-serif;font-size:19px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;
  color:#8FB4C7;padding:9px 18px 8px;border-bottom:3px solid transparent;white-space:nowrap}
.tab:hover{color:#fff}
.tab.on{color:#fff;border-bottom-color:var(--etiq)}

/* ---------- faena ---------- */
#faena{background:#0A3A52;color:#fff;border-top:1px solid rgba(255,255,255,.12);display:none}
#faena.open{display:block}
.fwrap{max-width:1680px;margin:0 auto;padding:14px 20px 18px}
.ftitle{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:#8FB4C7;margin-bottom:10px}
.fgrid{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.fcell{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.16);border-radius:var(--r);padding:8px 10px;min-width:104px}
.fcell label{display:block;font-family:"Barlow Condensed",sans-serif;font-size:17px;font-weight:600;color:var(--etiq);letter-spacing:.04em}
.fcell input{width:100%;background:transparent;border:none;border-bottom:1px solid rgba(255,255,255,.3);color:#fff;
  font-family:"IBM Plex Mono",monospace;font-size:14px;padding:3px 0;text-align:right}
.fcell .sub{font-size:10.5px;color:#8FB4C7;letter-spacing:.06em;text-transform:uppercase;margin-top:6px}

/* ---------- kpis ---------- */
main{max-width:1680px;margin:0 auto;padding:20px 22px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(196px,1fr));gap:1px;background:rgba(255,255,255,.10);
  border:1px solid rgba(255,255,255,.13);border-radius:5px;overflow:hidden;margin-bottom:14px;
  box-shadow:0 2px 18px rgba(0,0,0,.35)}
.kpi{background:linear-gradient(#1B252B,#161E23);padding:8px 14px 9px;display:flex;align-items:baseline;
  gap:9px;flex-wrap:wrap;text-align:left;width:100%;cursor:pointer}
.kpi .k{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:#8FA3AE;flex:0 0 100%;margin-bottom:1px}
.kpi .v{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:27px;line-height:1;letter-spacing:-.01em;color:#fff}
.kpi .u{font-size:12px;font-weight:600;color:#7C909B;margin-left:2px}
.kpi .s{font-size:11px;color:#8397A2;line-height:1.25}
.kpi.neg .v{color:#FF7A6B} .kpi.pos .v{color:#3FCB96} .kpi.war .v{color:#F2B24A}


/* matriz de ventas */
.mtx{max-height:calc(100vh - 250px);overflow:auto}
.mtx thead th{box-shadow:0 1px 0 var(--line)}
table.matriz th{vertical-align:bottom}
table.matriz th.vh{cursor:pointer;padding:5px 7px;font-size:12.5px;text-align:right;background:#F7FAFB}
table.matriz th.vh:hover{background:var(--frio2);color:var(--frio)}
table.matriz thead tr:nth-child(1) th.vh{position:sticky;top:0;font-family:"IBM Plex Mono",monospace;font-size:11px;
  color:var(--ink3);letter-spacing:0;text-transform:none;border-bottom:none;padding-bottom:2px}
table.matriz thead tr:nth-child(2) th.vh{position:sticky;top:24px;font-size:11px;letter-spacing:.02em;
  color:var(--ink2);border-bottom:none;padding:1px 7px}

    const t = ((c.d||'')+' '+(c.g||'')).toUpperCase();
    if(/^G\s*GRASA/i.test(c.g||'')) return true;
    if(/HALAK|KOSHER/.test(t)) return true;
    if(t.includes('CORAZON DE LENGUA')) return true;
    if((c.g||'').toUpperCase().trim()==='G BONETE') return true;
    if(/^\s*BONETE/.test((c.d||'').toUpperCase())) return true;  // no excluye "MONDONGO CON BONETE"
    return false;
  };
  const fuera = new Set(DATA.codigos.filter(excluir).map(c=>c.c));
  if(!fuera.size) return;
  DATA.codigos = DATA.codigos.filter(c=>!fuera.has(c.c));
  DATA.partidas = DATA.partidas.filter(p=>!fuera.has(p.c));
  DATA.ventas.forEach(v=>{ fuera.forEach(c=>delete v.items[c]); });
  DATA.ventas = DATA.ventas.filter(v=>Object.keys(v.items).length);
})();

/* PROVISORIO — venta cargada a mano hasta que aparezca en el archivo de saldos.
   Cuando el archivo la traiga, borrar este bloque. */
(function(){
  const prov=[{cod:'FD218022', kg:9000, cliente:'A confirmar', week:null}];
  prov.forEach(x=>{
    if(!DATA.codigos.some(c=>c.c===x.cod)) return;
    const ya = DATA.ventas.reduce((a,v)=>a+(v.items[x.cod]||0), 0);
    if(ya >= x.kg*0.8) return;            // ya llegó por archivo: se desactiva solo
    const falta = Math.round(x.kg - ya);
    DATA.ventas.push({nro:'s/n', cliente:x.cliente, week:x.week, madre:null,
      provisoria:true, items:{[x.cod]:falta}, contratado:{[x.cod]:falta}, cargado:{}});
  });
})();

const fmt = n => Math.round(n).toLocaleString('es-AR');
const tn  = n => (n/1000).toLocaleString('es-AR',{minimumFractionDigits:1,maximumFractionDigits:1});
const norm = s => (s||'').toString().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
const el  = (h)=>{const d=document.createElement('div');d.innerHTML=h.trim();return d.firstChild;};

const S = {tab:'proy', gen:'', q:'', venta:null, colapso:{}, orden:'gen', soloVta:false, form:null, qc:'', gc:'', expCom:null, qvp:'', qvv:'', kpi:null};
const CODM = Object.fromEntries(DATA.codigos.map(c=>[c.c,c]));
const WK = ()=>DATA.semanas.map(s=>s.w);

function prodSemana(cod, i){
  const s = DATA.semanas[i]; if(!s) return 0;
  const base = cod.base==='nokosher' ? (s.sinKosher!=null ? s.sinKosher : s.faena) : s.faena;
  return (cod.peso||0) * (cod.share||0) * base;
}

function calc(){
  const wk = DATA.semanas.length;
  const ventas = DATA.ventas.map((v,idx)=>({...v, idx, wnum: v.week && /^W\d+$/.test(v.week) ? +v.week.slice(1) : null}));
  const porCod = {};
  ventas.forEach(v=>Object.entries(v.items).forEach(([c,kg])=>{ (porCod[c]=porCod[c]||[]).push({v,kg}); }));
  const prio = v => { const w = v.wnum==null?999:(v.wnum<DATA.semanaCorte? v.wnum-100 : v.wnum); return w; };

  // pools: códigos que comparten la misma producción (el stock sigue siendo de cada código)
  const pools={};
  DATA.codigos.forEach(c=>{ const p=c.pool||('#'+c.c); (pools[p]=pools[p]||[]).push(c); });

  const R={};
  Object.entries(pools).forEach(([pid, miembros])=>{
    const prodProp={}, prodPool=Array.from({length:wk},(_,i)=>0);
    miembros.forEach(c=>{ prodProp[c.c]=Array.from({length:wk},(_,i)=>prodSemana(c,i));
      prodProp[c.c].forEach((x,i)=>prodPool[i]+=x); });

    const stockLibre={}; miembros.forEach(c=>stockLibre[c.c]=c.stock);
    const acum=prodPool.map(()=>0);
    const lista=[];
    miembros.forEach(c=>(porCod[c.c]||[]).forEach(x=>lista.push({cod:c.c, v:x.v, kg:x.kg})));
    lista.sort((a,b)=>prio(a.v)-prio(b.v));

    const asignPorCod={}; miembros.forEach(c=>asignPorCod[c.c]=[]);
    lista.forEach(x=>{
      let falta=x.kg;
      const deStock=Math.min(stockLibre[x.cod], falta); stockLibre[x.cod]-=deStock; falta-=deStock;
      let semanaFin = (deStock>0 && falta<=0.01) ? 0 : null;
      for(let i=0;i<wk && falta>0.01;i++){
        const disp=prodPool[i]-acum[i]; if(disp<=0) continue;
        const t=Math.min(disp, falta); acum[i]+=t; falta-=t;
        if(falta<=0.01) semanaFin=i+1;
      }
      asignPorCod[x.cod].push({venta:x.v, pedido:x.kg, stock:deStock, prod:x.kg-falta-deStock, falta, semanaFin});
    });

    const esPool = miembros.length>1;
    const stockPool=miembros.reduce((a,c)=>a+c.stock,0);
    const vendidoPool=lista.reduce((a,x)=>a+x.kg,0);
    const prodTotalPool=prodPool.reduce((a,b)=>a+b,0);
    const prodLibre=prodPool.map((p,i)=>p-acum[i]);

    miembros.forEach(c=>{
      const vend=(porCod[c.c]||[]).reduce((a,x)=>a+x.kg,0);
      const prodTot=prodProp[c.c].reduce((a,b)=>a+b,0);
      R[c.c]={cod:c, prod:prodProp[c.c], prodTotal:prodTot, vendido:vend, pendiente:c.stock-vend,
        aVender:c.stock-vend+prodTot, stockLibre:stockLibre[c.c],
        prodLibre: esPool? prodLibre.map(x=>x*(prodTot/(prodTotalPool||1))) : prodLibre,
        asign:asignPorCod[c.c], nVentas:(porCod[c.c]||[]).length,
        poolId: esPool?pid:null, poolName: esPool?(c.poolName||pid):null,
        poolProd: prodPool, poolPend: stockPool-vendidoPool, poolAVender: stockPool-vendidoPool+prodTotalPool,
        poolStock: stockPool, poolVendido: vendidoPool, poolProdTotal: prodTotalPool,
        poolMiembros: miembros.map(m=>m.c)};
    });
  });
  return {R, ventas};
}

function estadoItem(a){
  if(a.falta>0.01) return {t:'bad', txt:'No alcanza'};
  if(a.stock>=a.pedido-0.01) return {t:'ok', txt:'En stock'};
  const w = DATA.semanas[a.semanaFin-1];
  if(a.venta.wnum!=null && w && w.w > a.venta.wnum) return {t:'bad', txt:'Tarde'};
  return {t:'war', txt:'W'+(w?w.w:'?')};
}

function estadoVenta(v, R){
  const items = Object.keys(v.items).map(c=>(R[c].asign.find(a=>a.venta.idx===v.idx)));
  const tot = items.reduce((a,x)=>a+x.pedido,0);
  const stk = items.reduce((a,x)=>a+x.stock,0);
  const prd = items.reduce((a,x)=>a+x.prod,0);
  const flt = items.reduce((a,x)=>a+x.falta,0);
  const est = items.map(estadoItem);
  let t = 'ok';
  if(est.some(e=>e.t==='bad')) t='bad'; else if(est.some(e=>e.t==='war')) t='war';
  const atrasada = v.wnum!=null && v.wnum < DATA.semanaCorte;
  return {items, tot, stk, prd, flt, t, atrasada,
    finW: Math.max(...items.map(x=>x.semanaFin==null?99:(DATA.semanas[x.semanaFin-1]?.w||99)))};
}

function renderKpis(R, ventas){
  const st = sum(R,r=>r.cod.stock);
  const libre = Object.values(R).reduce((a,r)=>a+Math.max(0,r.stockLibre),0);
  const asignado = Math.max(0, st-libre);
  const pr = sum(R,r=>r.prodTotal);
  const enRiesgo = ventas.filter(v=>estadoVenta(v,R).t==='bad').length;
  const libres = Object.values(R).filter(r=>!r.cod.virtual && Math.max(0,r.stockLibre)>0);
  const consumo = libres.filter(r=>r.cod.consumo).reduce((a,r)=>a+Math.max(0,r.stockLibre),0);
  const expo = Math.max(0, libre-consumo);
  const nsv = libres.filter(r=>!r.cod.consumo && r.nVentas===0).length;
  const ncons = libres.filter(r=>r.cod.consumo).length;
  const K=[
    ['total','Stock total', tn(st), 'tn', fmt(DATA.codigos.reduce((a,c)=>a+c.cajas,0))+' cajas', ''],
    ['comp','Stock comprometido', tn(asignado), 'tn', st?Math.round(asignado/st*100)+'% del stock ya asignado':'', ''],
    ['sinv','Stock sin venta', tn(expo), 'tn', nsv+' códigos de exportación sin venta', 'pos'],
    ['cons','Stock consumo', tn(consumo), 'tn', ncons+' códigos de mercado local', ''],
    ['prod','Producción '+DATA.semanas.length+' sem', tn(pr), 'tn', fmt(DATA.semanas.reduce((a,s)=>a+s.faena,0))+' cabezas W'+DATA.semanas[0].w+'-W'+DATA.semanas[DATA.semanas.length-1].w, ''],
    ['riesgo','Ventas en riesgo', String(enRiesgo), '', 'no llegan a la fecha de carga', enRiesgo?'neg':'pos'],
  ];
  const ofr = Object.values(ofrecidoPorCod()).reduce((a,b)=>a+b,0);
  if(ofr) K.splice(3,0,['ofr','Ofrecido sin cerrar', tn(ofr), 'tn', OF.all().filter(o=>!vencida(o)).length+' ofertas activas','war']);
  document.getElementById('kpis').innerHTML = K.map(([id,k,v,u,s,c])=>
    `<button class="kpi ${c} ${S.kpi===id?'sel':''}" data-kpi="${id}"><div class="k">${k} <i>${S.kpi===id?'▾':'▸'}</i></div><div class="v">${v}<span class="u">${u}</span></div><div class="s">${s}</div></button>`).join('');
  document.querySelectorAll('[data-kpi]').forEach(b=>b.onclick=()=>{
    S.kpi = S.kpi===b.dataset.kpi ? null : b.dataset.kpi; render(); });
}

    let rows=Object.values(R).filter(r=>!r.cod.virtual);

    if(K==='total') rows=rows.filter(r=>r.cod.stock>0);

const sum=(R,f)=>Object.values(R).reduce((a,r)=>a+f(r),0);

function pintaSem(pend, prod){
  let saldo = pend;
  return prod.map(p=>{
    if(!p) return {c:'', s:'', n:'z'};
    const antes = saldo; saldo += p;
    if(antes >= 0) return {c:'sw-sinv', s:'', n:'sinv'};
    if(saldo <= 0) return {c:'sw-vend', s:'', n:'vend'};
    const pct = Math.round((-antes)/p*100);
    return {c:'sw-part', s:`background:linear-gradient(to right,#D7EFE3 0 ${pct}%,#FBE1DE ${pct}% 100%)`,
            n: pct>=50?'vend':'sinv'};
  });
}

/* ---- SIGNATURE: línea de semanas vendidas ---- */
function linea(r){
  const prod = r.poolId? r.poolProd : r.prod;
  const pin = pintaSem(r.poolId? r.poolPend : r.pendiente, prod);
  let out='';
  for(let i=0;i<prod.length;i++){
    const k=pin[i];
    const st = k.c==='sw-vend' ? 'background:#1E9C72'
             : k.c==='sw-sinv' ? 'background:#D8564A'
             : k.c==='sw-part' ? k.s.replace('#D7EFE3','#1E9C72').replace('#FBE1DE','#D8564A').replace('background:','background:')
             : 'background:#E4EBEF';
    out += `<div class="lseg" style="${st}" title="W${DATA.semanas[i].w}: ${fmt(prod[i])} kg"></div>`;
  }
  return `<div class="linea">${out}</div>`;
}

          <td class="av"><span class="n">${fmt(r.poolAVender)}</span></td>
          <td>${cob.txt}</td></tr>`;

        <td><span class="n z">${c.peso?(c.peso*(c.share||0)).toFixed(2):'—'}</span></td>
        <td><span class="n">${fmt(c.stock)}</span></td>
        <td><span class="n ${r.vendido?'':'z'}">${r.vendido?fmt(r.vendido):'—'}</span></td>
        <td><span class="n ${r.poolId?'z':(r.pendiente<0?'r':'g')}">${fmt(r.pendiente)}</span></td>
        ${(()=>{const pin=pintaSem(r.poolId?r.poolPend:r.pendiente, r.poolId?r.poolProd:r.prod);
          return r.prod.map((x,i)=>{const k=pin[i];
            return `<td class="${x?k.c:''}" style="${x?k.s:''}"><span class="n ${x?k.n:'z'}">${x?fmt(x):'—'}</span></td>`;}).join('');})()}

  body += `<tr class="tot"><td class="l">TOTAL</td><td></td>
    <td><span class="n">${fmt(rs.reduce((a,r)=>a+r.cod.stock,0))}</span></td>
    <td><span class="n">${fmt(rs.reduce((a,r)=>a+r.vendido,0))}</span></td>
    <td><span class="n">${fmt(rs.reduce((a,r)=>a+r.pendiente,0))}</span></td>
    ${DATA.semanas.map((s,i)=>`<td><span class="n">${fmt(rs.reduce((a,r)=>a+r.prod[i],0))}</span></td>`).join('')}
    <td class="av"><span class="n">${fmt(rs.reduce((a,r)=>a+r.aVender,0))}</span></td><td></td></tr>`;
  sc.innerHTML = `<table><thead>${th}</thead><tbody>${body}</tbody></table>`;
  setTimeout(()=>{
    const q=document.getElementById('q');

    p.querySelectorAll('.grp').forEach(t=>t.onclick=()=>{S.colapso[t.dataset.g]=!S.colapso[t.dataset.g];render();});
  });
  return p;

/* ---- vista COMERCIAL + ofertas del comercial ---- */
const OF = {
  key:'menudencias_ofertas_v1', mem:[], ok:true,
  load(){ try{ const s=localStorage.getItem(this.key); this.mem = s?JSON.parse(s):[]; }
          catch(e){ this.ok=false; } return this.mem; },
  save(){ try{ localStorage.setItem(this.key, JSON.stringify(this.mem)); }catch(e){ this.ok=false; } },
  all(){ return this.mem; },
  add(o){ o.id='o'+Date.now()+Math.random().toString(36).slice(2,6); this.mem.push(o); this.save(); },
  del(id){ this.mem=this.mem.filter(x=>x.id!==id); this.save(); },
  set(id,k,v){ const o=this.mem.find(x=>x.id===id); if(o){o[k]=v; this.save();} }
};
const hoyISO = ()=>new Date().toISOString().slice(0,10);
const vencida = o => o.hasta && o.hasta < hoyISO();
function ofrecidoPorCod(){
  const m={}; OF.all().forEach(o=>{ if(!vencida(o)) m[o.cod]=(m[o.cod]||0)+(+o.kg||0); }); return m;
}

function viewCom(R){
  const wrap=document.createElement('div');
  const ofm=ofrecidoPorCod();
  const NS=DATA.semanas.length;
  // una fila por código, salvo los pools: van en una sola fila con los valores del pool
  const vistos={}; const filas=[];
  Object.values(R).forEach(r=>{
    if(r.cod.virtual) return;
    if(r.poolId){ if(vistos[r.poolId]) return; vistos[r.poolId]=true; }
    filas.push(r);
  });
  const val = r => r.poolId
    ? {stock:r.poolStock, vend:r.poolVendido, pend:r.poolPend, prod:r.poolProdTotal, av:r.poolAVender,
       libre:r.poolMiembros.reduce((a,c)=>a+Math.max(0,R[c].stockLibre),0),
       ofr:r.poolMiembros.reduce((a,c)=>a+(ofm[c]||0),0),
       nv:r.poolMiembros.reduce((a,c)=>a+R[c].nVentas,0),
       nom:r.poolName, cod:r.poolMiembros.join(' + '), dest:r.cod.dest}
    : {stock:r.cod.stock, vend:r.vendido, pend:r.pendiente, prod:r.prodTotal, av:r.aVender,
       libre:Math.max(0,r.stockLibre), ofr:ofm[r.cod.c]||0, nv:r.nVentas,
       nom:r.cod.d, cod:r.cod.c, dest:r.cod.dest};
  const q=(S.qc||'').trim().toLowerCase();
  const rows=filas.map(r=>({r, v:val(r)})).filter(({r,v})=>{
    if(!(v.stock>0 || v.vend>0 || v.prod>0 || v.ofr)) return false;
    if(S.gc && r.cod.g!==S.gc) return false;
    if(q){ const t=norm(v.cod+' '+v.nom+' '+r.cod.g+' '+(v.dest||''));
           if(!norm(q).split(/\s+/).every(w=>t.includes(w))) return false; }
    return true;
  }).sort((a,b)=>(b.v.libre-b.v.ofr)-(a.v.libre-a.v.ofr));

  const gens=[...new Set(DATA.codigos.map(c=>c.g))].sort();
  const p=el(`<div class="panel"><div class="phead">
      <div class="ptitle">Qué tengo para vender</div>
      <div class="phint">Mismos números que Proyección · a vender = pendiente + producción − ofrecido</div>
      <div class="tools">
        <input class="inp" id="qc" placeholder="Buscar producto o código" value="${S.qc}">
        <select class="inp" id="gc"><option value="">Todos los genéricos</option>${gens.map(g=>`<option ${S.gc===g?'selected':''}>${g}</option>`).join('')}</select>
      </div>
    </div><div class="scroll mtx"></div></div>`);

  let body='';
  rows.forEach(({r,v})=>{
    const abierto = S.expCom===v.cod;
    const disp = v.av - v.ofr;
    let señal,cls;
    if(v.libre>3000 && v.nv===0 && !v.ofr){señal='Sin venta asignada';cls='t-opo';}
    else if(v.libre>3000 && v.prod>v.libre){señal='Riesgo de acumulación';cls='t-war';}
    else if(v.pend<0){señal='Sobrevendido';cls='t-bad';}
    else if(v.libre-v.ofr>0){señal='Disponible';cls='t-ok';}
    else {señal='Todo comprometido';cls='t-off';}
    body+=`<tr class="row ${r.poolId?'pool':''}"><td class="l"><span class="cod">${r.poolId?'POOL':v.cod}</span><div class="dsc">${v.nom}${r.poolId?' · '+v.cod:''}</div></td>
      <td class="l"><span class="wk" style="font-size:12px">${v.dest||'—'}</span>${r.cod.consumo?'<span class="tagc">consumo</span>':''}</td>
      <td><span class="n">${fmt(v.stock)}</span></td>
      <td>${v.vend?`<button class="vlink ${abierto?'on':''}" data-exp="${v.cod}">${fmt(v.vend)} <i>${abierto?'▾':'▸'}</i></button>`:'<span class="n z">—</span>'}</td>
      <td><span class="n ${v.pend<0?'r':'g'}">${fmt(v.pend)}</span></td>
      <td><span class="n ${v.libre-v.ofr>0?'g':'z'}">${fmt(Math.max(0,v.libre-v.ofr))}</span></td>
      <td><span class="n ${v.ofr?'a':'z'}">${v.ofr?fmt(v.ofr):'—'}</span></td>
      <td><span class="n ${v.prod?'':'z'}">${v.prod?fmt(v.prod):'—'}</span></td>
      <td class="av"><span class="n">${fmt(disp)}</span></td>
      <td><span class="tag ${cls}">${señal}</span></td>
      <td>${r.poolId?'':`<button class="mini" data-of="${v.cod}">+ Ofrecer</button>`}</td></tr>`;
    if(abierto) body+=`<tr class="sub"><td colspan="11">${detalleVentasCod(r, R)}</td></tr>`;
  });
  if(!rows.length) body=`<tr><td colspan="11" class="empty">Ningún producto coincide con la búsqueda.</td></tr>`;
  p.querySelector('.scroll').innerHTML=`<table><thead><tr>
    <th class="l">Producto</th><th class="l">Destino</th><th>Stock</th><th>Por cargar</th><th>Pendiente</th>
    <th>Libre hoy</th><th>Ofrecido</th><th>Prod. ${NS} sem</th><th class="av">A vender</th><th>Señal</th><th></th>
    </tr></thead><tbody>${body}</tbody></table>`;
  wrap.appendChild(p);
  wrap.appendChild(panelOfertas(R));
  setTimeout(()=>{
    p.querySelectorAll('[data-of]').forEach(b=>b.onclick=()=>abrirForm(b.dataset.of));
    p.querySelectorAll('[data-exp]').forEach(b=>b.onclick=()=>{
      S.expCom = S.expCom===b.dataset.exp ? null : b.dataset.exp; render(); });
    p.querySelectorAll('[data-goto]').forEach(b=>b.onclick=()=>{
      S.venta=+b.dataset.goto; S.tab='vta'; render(); window.scrollTo({top:0,behavior:'smooth'}); });
    const qi=document.getElementById('qc');
    if(qi){ qi.oninput=e=>{ S.qc=e.target.value; render();
        const n=document.getElementById('qc'); if(n){n.focus(); n.setSelectionRange(n.value.length,n.value.length);} };
      qi.onkeydown=e=>{ if(e.key==='Escape'){S.qc='';render();} }; }
    const gi=document.getElementById('gc'); if(gi) gi.onchange=e=>{S.gc=e.target.value;render();};
  });
  return wrap;
}

function detalleVentasCod(r, R){
  const src = r.poolId ? r.poolMiembros.flatMap(c=>R[c].asign.map(a=>({...a, _c:c}))) : r.asign.map(a=>({...a,_c:r.cod.c}));
  const rows = src.slice().sort((a,b)=>{
    const A=a.venta.wnum==null?9999:a.venta.wnum, B=b.venta.wnum==null?9999:b.venta.wnum; return A-B; });
  let t=`<table class="mini-t"><thead><tr><th class="l">Venta</th><th class="l">Cliente</th><th>Carga</th>
    <th>Kilos</th><th>Con stock</th><th>A producir</th><th>Sin cubrir</th><th>Estado</th></tr></thead><tbody>`;
  rows.forEach(a=>{
    const st=estadoItem(a), v=a.venta, cod=r.cod;
    const late = v.wnum!=null && v.wnum<DATA.semanaCorte;
    t+=`<tr><td class="l"><button class="vlink" data-goto="${v.idx}">${v.nro}</button>${r.poolId?` <span class="cod">${a._c}</span>`:''}</td>
      <td class="l">${v.cliente||'—'}</td>
      <td class="${late?'late-t':''}">${v.week||'—'}${late?' ⚠':''}</td>
      <td><span class="n">${fmt(a.pedido)}</span></td>
      <td><span class="n ${a.stock?'g':'z'}">${fmt(a.stock)}</span></td>
      <td><span class="n ${a.prod?'a':'z'}">${a.prod?fmt(a.prod):'—'}</span></td>
      <td><span class="n ${a.falta>1?'r':'z'}">${a.falta>1?fmt(a.falta):'—'}</span></td>
      <td><span class="tag ${st.t==='ok'?'t-ok':st.t==='war'?'t-war':'t-bad'}">${st.txt}</span></td></tr>`;
  });
  return t+`</tbody></table>`;
}

/* ---- vista SEGUIMIENTO DE VENTAS: matriz códigos x ventas ---- */
function ordenVentas(ventas){
  return ventas.slice().sort((a,b)=>{
    const A=a.wnum==null?9999:a.wnum, B=b.wnum==null?9999:b.wnum;
    return A-B || (a.nro<b.nro?-1:1);
  });
}

      ${extra}${cel}
      <td class="e1"><span class="n ${r.vendido?'':'z'}">${r.vendido?fmt(r.vendido):'—'}</span></td>
      <td class="e2"><span class="n ${r.pendiente<0?'r':'g'}">${fmt(r.pendiente)}</span></td>
      <td class="e4">${cob.txt}</td></tr>`;
  });
  let tot='';
  ord.forEach(v=>{
    const t=filas.reduce((a,c)=>a+(v.items[c.c]||0),0);
    tot+=`<td class="vcol${sel&&v.idx===sel.idx?' pick':''}">${t?`<span class="n">${fmt(t)}</span>`:''}</td>`;
  });
  body+=`<tr class="tot"><td class="l stk1">TOTAL</td>
    <td class="stk2"><span class="n">${fmt(filas.reduce((a,c)=>a+c.stock,0))}</span></td>
    ${sel?'<td class="fx"></td><td class="fx"></td><td class="fx"></td><td class="fx"></td>':''}${tot}
    <td class="e1"><span class="n">${fmt(filas.reduce((a,c)=>a+R[c.c].vendido,0))}</span></td>
    <td class="e2"><span class="n">${fmt(filas.reduce((a,c)=>a+R[c.c].pendiente,0))}</span></td>
    <td class="e4"></td></tr>`;

  if(!filas.length) body=`<tr><td class="empty" colspan="99">Ningún producto coincide con el filtro.</td></tr>`;
  p.querySelector('.scroll').innerHTML=`<table class="matriz"><thead>
    <tr><th class="stk1 lbl">Semana de carga →</th><th class="stk2" rowspan="3">Stock</th>
        ${sel?`<th class="fx grpv" colspan="4">En esta venta</th>`:''}${h1}
        <th rowspan="3" class="e1">Acumul.</th><th rowspan="3" class="e2">Saldo</th>
        <th rowspan="3" class="e4">Cubre</th></tr>
    <tr><th class="stk1 lbl">Cliente →</th>${sel?extraTh:''}${h2}</tr>
    <tr><th class="l stk1">Producto</th>${sel?'<th class="fx"></th><th class="fx"></th><th class="fx"></th><th class="fx"></th>':''}${h3}</tr>
    </thead><tbody>${body}</tbody></table>`;

  setTimeout(()=>{
    p.querySelectorAll('.vh').forEach(t=>t.onclick=()=>{
      const i=+t.dataset.v; S.venta = (S.venta===i)?null:i; render();
      document.querySelector('[data-tab="vta"]').scrollIntoView({block:'nearest'});
    });
    const b=document.getElementById('soloVta'); if(b) b.onclick=()=>{S.soloVta=!S.soloVta;render();};
    [['qvp','qvp'],['qvv','qvv']].forEach(([id,k])=>{
      const n=document.getElementById(id); if(!n) return;
      n.oninput=e=>{ S[k]=e.target.value; render();
        const x=document.getElementById(id); if(x){x.focus(); x.setSelectionRange(x.value.length,x.value.length);} };
      n.onkeydown=e=>{ if(e.key==='Escape'){ S[k]=''; render(); } };
    });
    const q=document.getElementById('quitar'); if(q) q.onclick=()=>{S.venta=null;render();};
  });
  wrap.appendChild(p);
  return wrap;
}

function bandaFiltro(R, ventas, v){
  const e=estadoVenta(v,R);
  const pct=x=>(x/e.tot*100).toFixed(2)+'%';
  const herm=ventas.filter(x=>x.idx!==v.idx && (x.madre===v.nro||x.nro===v.madre||(v.madre&&x.madre===v.madre)));
  const d=el(`<div class="panel filtro">
    <div class="fhead">
      <div class="fnro">${v.nro}${v.provisoria?' <span class="tag t-war">provisoria</span>':''}</div>
      <div class="fmeta"><b>${v.cliente||'sin cliente'}</b>
        ${v.puerto?`<span>${v.puerto}</span>`:''}
        <span>carga ${v.week||'sin fecha'}${v.fecha?' · '+new Date(v.fecha+'T12:00').toLocaleDateString('es-AR'):''}${e.atrasada?' · <b style="color:#7B2D8E">vencida</b>':''}</span>
        <span>${Object.keys(v.items).length} producto${Object.keys(v.items).length>1?'s':''} · <b>${fmt(e.tot)} kg</b> por cargar</span>
        </div>
      <div class="fest"><span class="tag ${e.t==='ok'?'t-ok':e.t==='war'?'t-war':'t-bad'}">${
        e.t==='ok'?'Completa':e.flt>1?'No alcanza':(e.finW>=99?'Sin fecha':'Cierra W'+e.finW)}</span></div>
    </div>
    <div class="fbody">
      <div class="bar big"><i class="b-stk" style="width:${pct(e.stk)}"></i><i class="b-prd" style="width:${pct(e.prd)}"></i><i class="b-flt" style="width:${pct(e.flt)}"></i></div>
      <div class="leg"><span><i style="background:var(--ok)"></i>${fmt(e.stk)} kg en stock</span>
        <span><i style="background:#7FB3A2"></i>${fmt(e.prd)} kg los cubre la producción</span>
        ${e.flt>1?`<span><i style="background:var(--rojo)"></i><b style="color:var(--rojo)">${fmt(e.flt)} kg sin cubrir</b></span>`:''}</div>
      ${herm.length?`<div class="herm">Del mismo pedido: ${herm.map(x=>`<button class="chip" data-h="${x.idx}">${x.nro} · ${x.week||'s/f'}</button>`).join('')}</div>`:''}

    </div></div>`);
  setTimeout(()=>d.querySelectorAll('[data-h]').forEach(b=>b.onclick=()=>{S.venta=+b.dataset.h;render();}));
  return d;
}

function coberturaW(r){
  const pend = r.poolId? r.poolPend : r.pendiente;
  const prod = r.poolId? r.poolProd : r.prod;
  if(pend>=0) return {txt:'<span class="tag t-ok">En stock</span>', w:0};
  let saldo=pend;
  for(let i=0;i<prod.length;i++){ saldo+=prod[i];
    if(saldo>=0) return {txt:`<span class="tag t-war">W${DATA.semanas[i].w}</span>`, w:DATA.semanas[i].w}; }
  return {txt:'<span class="tag t-bad">No llega</span>', w:99};
}

/* ---- vista ROTACIÓN ---- */
function viewRot(R){
  const wrap=document.createElement('div');
  const byCod={}; DATA.partidas.forEach(p=>(byCod[p.c]=byCod[p.c]||[]).push(p));
  const rows = Object.values(R).filter(r=>r.cod.stock>0 && !r.cod.virtual).map(r=>{
    const ps=(byCod[r.cod.c]||[]).slice().sort((a,b)=>a.fp<b.fp?-1:1);
    const kg=r.cod.stock;
    const antPond = ps.reduce((a,p)=>a+p.ant*p.kg,0)/(kg||1);
    const viejo = ps.filter(p=>p.ant>60).reduce((a,p)=>a+p.kg,0);
    const porVencer = ps.filter(p=>p.dv!=null&&p.dv<180).reduce((a,p)=>a+p.kg,0);
    const sinVta = r.nVentas===0 ? r.cod.stock : 0;
    return {r, ps, antPond, viejo, porVencer, sinVta, masViejo: ps.length?ps[0]:null,
            idx: Math.max(viejo, sinVta*0.5)};
  }).sort((a,b)=>b.idx-a.idx || b.antPond-a.antPond);
  const p=el(`<div class="panel"><div class="phead">
    <div class="ptitle">Rotación y antigüedad</div>
    <div class="phint">FIFO por fecha de producción · lo de arriba es lo que más tiempo lleva en cámara</div>
    </div><div class="scroll mtx"></div></div>`);
  let body='';
  rows.forEach(x=>{
    const sinVenta = x.r.nVentas===0;
    let cls='t-ok', txt='Normal';
    if(x.antPond>120){cls='t-bad';txt='Inmovilizado';}
    else if(x.antPond>60){cls='t-war';txt='Lento';}
    if(sinVenta && x.r.cod.stock>3000){cls='t-opo';txt='Sin venta asignada';}
    body+=`<tr class="row"><td class="l"><span class="cod">${x.r.cod.c}</span><div class="dsc">${x.r.cod.d}</div></td>
      <td><span class="n">${fmt(x.r.cod.stock)}</span></td>
      <td><span class="n ${x.antPond>90?'r':x.antPond>45?'a':''}">${Math.round(x.antPond)}</span></td>
      <td><span class="n z">${x.masViejo?x.masViejo.ant:'—'}</span></td>
      <td><span class="n ${x.viejo>0?'a':'z'}">${x.viejo>0?fmt(x.viejo):'—'}</span></td>
      <td><span class="n ${x.porVencer>0?'r':'z'}">${x.porVencer>0?fmt(x.porVencer):'—'}</span></td>
      <td><span class="n ${sinVenta?'a':'z'}">${sinVenta?'—':fmt(x.r.vendido)}</span></td>
      <td><span class="tag ${cls}">${txt}</span></td></tr>`;
  });
  p.querySelector('.scroll').innerHTML=`<table><thead><tr><th class="l">Producto</th><th>Stock</th>
    <th>Días prom.</th><th>Partida + vieja</th><th>&gt;60 días</th><th>Vence &lt;180d</th><th>Comprometido</th><th>Estado</th></tr></thead><tbody>${body}</tbody></table>`;
  wrap.appendChild(p);
  return wrap;
}

/* ---- vista ALERTAS ---- */
function viewAlertas(R, ventas){
  const A=[];
  ventas.forEach(v=>{
    const e=estadoVenta(v,R);
    if(e.flt>1) A.push(['bad','RIESGO DE FALTANTE',`Venta ${v.nro} · ${v.cliente||'sin cliente'}`,
      `Faltan ${fmt(e.flt)} kg que no cubre ni el stock ni la producción de ${DATA.semanas.length} semanas.`]);
    else if(v.wnum!=null && e.finW>v.wnum && e.prd>0) A.push(['bad','LLEGA TARDE',`Venta ${v.nro} · ${v.cliente||'sin cliente'}`,
      `Se completa recién en W${e.finW} y la carga es W${v.wnum}.`]);
    if(v.wnum!=null && v.wnum<DATA.semanaCorte) A.push(['bad','CARGA VENCIDA',`Venta ${v.nro} · ${v.cliente||'sin cliente'}`,
      `La fecha de carga era W${v.wnum} y ya estamos en W${DATA.semanaCorte}.`]);
  });
  Object.values(R).forEach(r=>{
    if(r.cod.virtual) return;
    if(r.nVentas===0 && r.cod.stock>3000)
      A.push(['opo','OPORTUNIDAD COMERCIAL',r.cod.c+' · '+r.cod.d,
        `${fmt(r.cod.stock)} kg en cámara sin ninguna venta asignada${r.prodTotal>0?`, más ${fmt(r.prodTotal)} kg proyectados`:''}.`]);
    else if(r.pendiente>0 && r.prodTotal>r.pendiente*2 && r.cod.stock>2000)
      A.push(['war','RIESGO DE SOBRESTOCK',r.cod.c+' · '+r.cod.d,
        `Sobran ${fmt(r.pendiente)} kg y se proyectan ${fmt(r.prodTotal)} kg más en ${DATA.semanas.length} semanas.`]);
  });
  OF.all().filter(vencida).forEach(o=>{
    const c=CODM[o.cod];
    A.push(['war','OFERTA VENCIDA',`${o.cod} · ${c?c.d:''}`,
      `${fmt(+o.kg||0)} kg ofrecidos a ${o.cliente||'un cliente'} quedaron sin respuesta y volvieron a estar disponibles.`]);
  });
  const ord={bad:0,war:1,opo:2};
  A.sort((a,b)=>ord[a[0]]-ord[b[0]]);
  const p=el(`<div class="panel"><div class="phead"><div class="ptitle">Alertas</div>
    <div class="phint">${A.length} para revisar</div></div><div class="alerts"></div></div>`);
  const box=p.querySelector('.alerts');
  if(!A.length) box.innerHTML='<div class="empty">Nada urgente. Todas las ventas se cubren a tiempo.</div>';
  A.forEach(([t,tit,suj,why])=>{
    box.appendChild(el(`<div class="al"><span class="ic"><span class="dot d-${t==='bad'?'bad':t==='war'?'war':'opo'}"></span></span>
      <div><b>${tit}</b> — ${suj}<div class="why">${why}</div></div></div>`));
  });
  return p;
}

/* ---- faena ---- */
function renderFaena(){
  document.getElementById('fgrid').innerHTML = DATA.semanas.map((s,i)=>
    `<div class="fcell"><label>W${s.w}</label>
      <input type="number" data-i="${i}" data-k="faena" value="${s.faena}" step="100" min="0">
      <div class="sub">total</div>
      <input type="number" data-i="${i}" data-k="sinKosher" value="${s.sinKosher}" step="100" min="0">
      <div class="sub">sin kosher</div></div>`).join('');
  document.querySelectorAll('#fgrid input').forEach(inp=>inp.onchange=e=>{
    DATA.semanas[+e.target.dataset.i][e.target.dataset.k] = +e.target.value||0; render();
  });
}
document.getElementById('btnFaena').onclick=()=>document.getElementById('faena').classList.toggle('open');

OF.load();
function isoWeek(d){
  const t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));
  t.setUTCDate(t.getUTCDate()+4-(t.getUTCDay()||7));
  return Math.ceil(((t-Date.UTC(t.getUTCFullYear(),0,1))/86400000+1)/7);
}
(function(){
  const hoy=new Date();
  const f = hoy.toLocaleDateString('es-AR',{weekday:'long',day:'numeric',month:'long',year:'numeric'}).replace(',','');
  document.getElementById('bFecha').textContent = f.charAt(0).toUpperCase()+f.slice(1);
  document.getElementById('bSem').textContent = 'W'+isoWeek(hoy);
})();
renderFaena(); render();
